[project]
name = "gatekeeper-agent"
version = "0.1.0"
description = "AI Guardian Core - 静态代码审核 Agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AI Guardian Team", email = "team@aiguardian.dev"}
]
keywords = ["code-review", "ai", "security", "static-analysis", "git-hook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "tree-sitter-go>=0.20",
    "tree-sitter-javascript>=0.20",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "flake8>=6.0",
]
llm = [
    "ollama>=0.1.0",
    "openai>=1.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
]

[project.scripts]
gatekeeper = "gatekeeper_agent.cli:main"
gk = "gatekeeper_agent.cli:main"

[project.urls]
Homepage = "https://github.com/aiguardian/gatekeeper-agent"
Documentation = "https://docs.aiguardian.dev"
Repository = "https://github.com/aiguardian/gatekeeper-agent"
Issues = "https://github.com/aiguardian/gatekeeper-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=gatekeeper_agent --cov-report=term-missing"
